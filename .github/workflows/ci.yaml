name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'

jobs:
  quality-checks:
    name: "Проверки качества"
    runs-on: ubuntu-latest
    steps:
      - name: "⏬ Забрать код"
        uses: actions/checkout@v4

      - name: "🐍 Установить Python"
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: "📦 Установить все зависимости"
        run: |
          pip install -e ".[dev]"
          # Или если используете requirements.txt:
          # pip install -r requirements.txt -r requirements-dev.txt

      - name: "🔍 Запустить линтинг"
        run: make lint

      - name: "🚀 Запустить тесты"
        run: make test

      - name: "📦 Сборка пакета"
        run: make build
